<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ТЁМНАЯ ТРЕВОГА</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* CÓDIGOS ROXOS */
#matrix {
    position: fixed;
    inset: 0;
    opacity: .28;
    overflow: hidden;
}

.code {
    position: absolute;
    top: -120%;
    color: #a000ff;
    font-size: 14px;
    line-height: 24px;
    white-space: pre;
    text-shadow: 0 0 8px #a000ff;
    animation: fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(230vh); }
}

/* INTERFERÊNCIA */
#noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    z-index: 20;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            rgba(255,255,255,.3) 1px,
            transparent 2px,
            transparent 4px
        );
}

/* PAINEL */
.panel {
    position: absolute;
    z-index: 5;
    width: 88%;
    max-width: 600px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 18px;
    text-align: center;
    background: rgba(5,0,0,.96);
    border: 2px solid red;
    box-shadow: 0 0 25px red, 0 0 70px rgba(255,0,0,.3);
}

.warning {
    color: red;
    font-weight: bold;
    font-size: clamp(11px, 3vw, 18px);
    animation: blink .7s infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

h1 {
    color: red;
    font-size: clamp(24px, 7vw, 45px);
    text-shadow: 0 0 10px red, 0 0 25px red;
}

#timer {
    display: inline-block;
    color: #00ff33;
    border: 2px solid #00ff33;
    padding: 5px 15px;
    font-size: clamp(55px, 17vw, 100px);
    font-weight: bold;
    text-shadow: 0 0 20px #00ff33;
    box-shadow: 0 0 20px #00ff33;
}

/* TERMINAL */
.terminal {
    margin-top: 15px;
    padding: 12px;
    text-align: left;
    color: #ff5555;
    background: #000;
    border: 1px solid #550000;
    font-size: clamp(10px, 3vw, 14px);
    line-height: 1.8;
}

.green { color: #00ff33; }
.red { color: red; font-weight: bold; }

.bar {
    height: 7px;
    margin-top: 15px;
    background: #102000;
}

#progress {
    width: 100%;
    height: 100%;
    background: #00ff33;
    box-shadow: 0 0 12px #00ff33;
}

/* GLITCH */
.glitch {
    animation: shake .12s infinite;
}

@keyframes shake {
    0%, 100% { transform: translate(-50%, -50%); }
    25% { transform: translate(calc(-50% + 3px), calc(-50% - 2px)); }
    50% { transform: translate(calc(-50% - 3px), calc(-50% + 2px)); }
    75% { transform: translate(calc(-50% + 2px), calc(-50% + 3px)); }
}

/* TELA FINAL */
#completed {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
    background: #000;
    color: #00ff33;
    font-size: clamp(55px, 18vw, 200px);
    font-weight: bold;
    text-align: center;
    text-shadow: 0 0 20px #00ff33, 0 0 60px #00ff33;
    animation: finalGlitch .5s infinite;
}

@keyframes finalGlitch {
    50% {
        transform: translate(3px, -2px);
        opacity: .8;
    }
}

/* FLASH */
.flash {
    animation: redFlash .15s infinite;
}

@keyframes redFlash {
    50% { background: #400000; }
}
</style>
</head>

<body>

<div id="matrix"></div>
<div id="noise"></div>

<div class="panel" id="panel">

    <div class="warning">
        🇷🇺 ⚠ СИСТЕМНОЕ ПРЕДУПРЕЖДЕНИЕ ⚠ 🇷🇺
    </div>

    <h1>ТЁМНАЯ ТРЕВОГА</h1>

    <div id="timer">05:00</div>

    <div class="terminal">
        &gt; ПРОВЕРКА СИСТЕМЫ: <span class="green">АКТИВНО</span><br>
        &gt; ОБРАБОТКА ДАННЫХ: <span class="green">ЗАВЕРШЕНО</span><br>
        &gt; СОЕДИНЕНИЕ: <span class="green">АКТИВНО</span><br>
        &gt; СОСТОЯНИЕ: <span class="red">КРИТИЧЕСКОЕ</span>
    </div>

    <div class="bar">
        <div id="progress"></div>
    </div>

</div>

<div id="completed">ЗАВЕРШЕНО</div>

<script>
const matrix = document.getElementById("matrix");

for (let i = 0; i < 12; i++) {
    const code = document.createElement("div");
    code.className = "code";
    code.style.left = Math.random() * 100 + "%";
    code.style.animationDuration = (30 + Math.random() * 15) + "s";

    let text = "";
    for (let j = 0; j < 70; j++) {
        text += "010101 110010 001101 404\n";
    }

    code.textContent = text;
    matrix.appendChild(code);
}

let remaining = 5 * 60;

const timer = document.getElementById("timer");
const progress = document.getElementById("progress");
const panel = document.getElementById("panel");

const interval = setInterval(() => {
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timer.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    progress.style.width = (remaining / 300 * 100) + "%";

    /* ÚLTIMO MINUTO: EFEITOS VISUAIS */
    if (remaining <= 60 && remaining > 0) {
        panel.classList.add("glitch");
        document.body.classList.add("flash");
    }

    if (remaining <= 0) {
        clearInterval(interval);

        panel.style.display = "none";
        matrix.style.display = "none";
        document.getElementById("noise").style.display = "none";

        document.getElementById("completed").style.display = "flex";
        return;
    }

    remaining--;

}, 1000);
</script>

</body>
</html>
