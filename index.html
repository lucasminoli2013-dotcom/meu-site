<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SECURITY BREACH</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #020000;
    color: #ff0000;
    font-family: "Courier New", monospace;
}

/* FUNDO COM CÓDIGOS */
#codes {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    opacity: .3;
}

.code {
    position: absolute;
    top: -120%;
    color: #ff0000;
    font-size: 13px;
    white-space: pre;
    animation: cair linear infinite;
}

@keyframes cair {
    to {
        transform: translateY(220vh);
    }
}

/* MÁSCARA */
.mask {
    position: fixed;
    z-index: 1;
    width: 320px;
    height: 390px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    opacity: .18;
}

.face {
    position: absolute;
    inset: 20px;
    background: #080000;
    border: 5px solid #ff0000;
    border-radius: 45% 45% 50% 50%;
    box-shadow: 0 0 40px #ff0000;
}

.eye {
    position: absolute;
    top: 105px;
    width: 85px;
    height: 35px;
    background: #ff0000;
    box-shadow: 0 0 25px #ff0000;
    transform: rotate(-12deg);
}

.eye.left {
    left: 40px;
}

.eye.right {
    right: 40px;
    transform: rotate(12deg);
}

.nose {
    position: absolute;
    top: 145px;
    left: 135px;
    width: 45px;
    height: 70px;
    border-left: 5px solid #ff0000;
    border-right: 5px solid #ff0000;
}

.mouth {
    position: absolute;
    bottom: 70px;
    left: 65px;
    width: 150px;
    height: 35px;
    border-bottom: 7px solid #ff0000;
    border-radius: 50%;
}

/* PAINEL */
.container {
    position: relative;
    z-index: 3;
    width: 90%;
    max-width: 850px;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    padding: 35px;
    text-align: center;
    background: rgba(0,0,0,.88);
    border: 2px solid #ff0000;
    box-shadow: 0 0 35px #ff0000;
}

h1 {
    margin: 0;
    font-size: clamp(35px, 7vw, 70px);
    text-shadow: 0 0 20px red;
    animation: piscar .7s infinite;
}

@keyframes piscar {
    50% {
        opacity: .45;
    }
}

.subtitle {
    margin-top: 15px;
    font-size: 18px;
    letter-spacing: 3px;
}

#timer {
    margin: 25px 0;
    font-size: clamp(65px, 13vw, 120px);
    font-weight: bold;
    text-shadow: 0 0 30px red;
}

.terminal {
    text-align: left;
    padding: 18px;
    border: 1px solid #770000;
    background: #050000;
    line-height: 1.8;
}

.danger {
    color: #ff0000;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="codes"></div>

<!-- MÁSCARA DE HACKER -->
<div class="mask">
    <div class="face"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="nose"></div>
    <div class="mouth"></div>
</div>

<div class="container">

    <h1>⚠ SYSTEM BREACH ⚠</h1>

    <div class="subtitle">
        ACESSO NÃO AUTORIZADO DETECTADO
    </div>

    <div id="timer">20:00</div>

    <div class="terminal">
        &gt; SECURITY STATUS:
        <span class="danger">CRITICAL</span><br>

        &gt; SYSTEM CONNECTION:
        <span class="danger">COMPROMISED</span><br>

        &gt; SECURITY PROTOCOL:
        <span class="danger">FAILED</span><br>

        &gt; COUNTDOWN:
        <span class="danger">ACTIVE</span>
    </div>

</div>

<script>

/* CÓDIGOS DO FUNDO */

const fundo = document.getElementById("codes");

const caracteres =
"010101010101 SYSTEM ERROR ACCESS DENIED 010101 ERROR 404 00110011";

for (let i = 0; i < 22; i++) {

    const codigo = document.createElement("div");

    codigo.className = "code";

    codigo.style.left =
        Math.random() * 100 + "%";

    codigo.style.animationDuration =
        (5 + Math.random() * 10) + "s";

    codigo.style.animationDelay =
        Math.random() * 8 + "s";

    let texto = "";

    for (let j = 0; j < 70; j++) {
        texto += caracteres.charAt(
            Math.floor(Math.random() * caracteres.length)
        );

        if (j % 4 === 0) {
            texto += "\n";
        }
    }

    codigo.textContent = texto;

    fundo.appendChild(codigo);
}


/* CONTADOR */

let tempo = 20 * 60;

function atualizar() {

    let minutos = Math.floor(tempo / 60);
    let segundos = tempo % 60;

    document.getElementById("timer").textContent =
        String(minutos).padStart(2, "0") +
        ":" +
        String(segundos).padStart(2, "0");

    if (tempo > 0) {
        tempo--;
    }
}

atualizar();

setInterval(atualizar, 1000);

</script>

</body>
</html>
