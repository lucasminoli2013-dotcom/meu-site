<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

#matrix {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: .30;
}

.code {
    position: absolute;
    top: -100%;
    color: #a000ff;
    font-size: 14px;
    line-height: 24px;
    white-space: pre;
    text-shadow: 0 0 7px #a000ff;
    animation: fall linear infinite;
}

@keyframes fall {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(220vh);
    }
}

.dark {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(
        circle,
        transparent 0%,
        rgba(0,0,0,.88) 80%
    );
}

.panel {
    position: absolute;
    z-index: 5;
    width: 88%;
    max-width: 560px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 12px;
    background: rgba(5,0,0,.96);
    border: 2px solid #ff0000;
    box-shadow: 0 0 20px red, 0 0 45px rgba(255,0,0,.25);
    text-align: center;
}

.warning {
    color: red;
    font-size: clamp(11px, 3.2vw, 17px);
    font-weight: bold;
    letter-spacing: 1px;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: .35;
    }
}

h1 {
    margin: 10px 0;
    color: red;
    font-size: clamp(23px, 7vw, 42px);
    text-shadow: 0 0 8px red, 0 0 20px red;
}

#timer {
    display: inline-block;
    color: #00ff33;
    background: #000;
    border: 2px solid #00ff33;
    padding: 2px 12px;
    font-size: clamp(52px, 16vw, 90px);
    font-weight: bold;
    text-shadow: 0 0 20px #00ff33;
    box-shadow: 0 0 18px rgba(0,255,51,.5);
}

.terminal {
    margin-top: 14px;
    padding: 11px;
    background: #010101;
    border: 1px solid #440000;
    text-align: left;
    color: #ff3333;
    font-size: clamp(10px, 3vw, 13px);
    line-height: 1.8;
}

.green {
    color: #00ff33;
}

.red {
    color: red;
    font-weight: bold;
}

.bar {
    height: 6px;
    margin-top: 14px;
    background: #092000;
}

#progress {
    width: 100%;
    height: 100%;
    background: #00ff33;
    box-shadow: 0 0 10px #00ff33;
    transition: width 1s linear;
}

#status {
    margin-top: 10px;
    color: red;
    font-size: clamp(9px, 2.8vw, 12px);
    font-weight: bold;
}

.videos {
    margin-top: 12px;
    padding-top: 9px;
    border-top: 1px solid #440000;
    color: #a000ff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #a000ff;
}

@media (max-height: 650px) {
    .panel {
        padding: 10px;
    }

    h1 {
        margin: 5px 0;
    }

    .terminal {
        margin-top: 8px;
        line-height: 1.5;
    }

    .videos {
        margin-top: 8px;
    }
}
</style>
</head>

<body>

<div id="matrix"></div>
<div class="dark"></div>

<div class="panel">

    <div class="warning">
        🇷🇺 ⚠ СИСТЕМА УСПЕШНО ВЗЛОМАНА ⚠ 🇷🇺
    </div>

    <h1>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</h1>

    <div id="timer">05:00</div>

    <div class="terminal">
        &gt; ФОРМАТИРОВАНИЕ:
        <span class="green">АКТИВНО</span><br>

        &gt; КОПИРОВАНИЕ ДАННЫХ:
        <span class="green">УСПЕШНО</span><br>

        &gt; ВЗЛОМ СИСТЕМЫ:
        <span class="green">УСПЕШНО</span><br>

        &gt; МЕСТОПОЛОЖЕНИЕ:
        <span class="green">ОПРЕДЕЛЕНО</span><br>

        &gt; СОСТОЯНИЕ:
        <span class="red">КРИТИЧЕСКОЕ</span>
    </div>

    <div class="bar">
        <div id="progress"></div>
    </div>

    <div id="status">
        ПРОЦЕСС ИНИЦИАЛИЗИРУЕТСЯ...
    </div>

    <div class="videos">
        X ВИДЕОЗАПИСЕЙ
    </div>

</div>

<script>
const matrix = document.getElementById("matrix");

const chars = "010101 110010 001101 101010 001100 ОШИБКА 404";

for (let i = 0; i < 12; i++) {
    const code = document.createElement("div");
    code.className = "code";

    code.style.left = Math.random() * 100 + "%";

    /* NÚMEROS MAIS LENTOS */
    code.style.animationDuration =
        (30 + Math.random() * 15) + "s";

    code.style.animationDelay =
        Math.random() * 12 + "s";

    let text = "";

    for (let j = 0; j < 70; j++) {
        text += chars + "\n";
    }

    code.textContent = text;
    matrix.appendChild(code);
}

/* TIMER DE 5 MINUTOS */
let remaining = 5 * 60;

const timer = document.getElementById("timer");
const progress = document.getElementById("progress");

function updateTimer() {
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timer.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    progress.style.width =
        (remaining / 300 * 100) + "%";

    if (remaining > 0) {
        remaining--;
    }
}

updateTimer();
setInterval(updateTimer, 1000);

/* MENSAGENS EM RUSSO */
const messages = [
    "ПРОЦЕСС ИНИЦИАЛИЗИРУЕТСЯ...",
    "СОЕДИНЕНИЕ АКТИВНО...",
    "ОБРАБОТКА ДАННЫХ...",
    "ПРОТОКОЛ БЕЗОПАСНОСТИ АКТИВЕН...",
    "ДОСТУП РАЗРЕШЁН...",
    "СОСТОЯНИЕ: КРИТИЧЕСКОЕ..."
];

let index = 0;

setInterval(() => {
    document.getElementById("status").textContent =
        messages[index];

    index = (index + 1) % messages.length;
}, 2200);
</script>

</body>
</html>
