<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA COMPROMETIDO</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: #00ff41;
        font-family: "Courier New", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .box {
        width: 90%;
        max-width: 800px;
        padding: 40px;
        border: 2px solid #00ff41;
        box-shadow: 0 0 30px #00ff41;
        background: rgba(0, 20, 0, 0.9);
    }

    .warning {
        color: #ff2222;
        text-shadow: 0 0 15px red;
        font-size: clamp(35px, 7vw, 70px);
        margin: 0;
        animation: blink 0.8s infinite;
    }

    .subtitle {
        font-size: 20px;
        margin: 20px 0;
    }

    #timer {
        font-size: clamp(60px, 12vw, 110px);
        font-weight: bold;
        color: #ff2222;
        text-shadow: 0 0 20px red;
        margin: 30px 0;
    }

    .terminal {
        text-align: left;
        padding: 20px;
        border: 1px solid #00ff41;
        margin-top: 20px;
        line-height: 1.8;
    }

    .fake {
        color: #00ff41;
    }

    button {
        margin-top: 25px;
        padding: 12px 25px;
        background: transparent;
        border: 1px solid #00ff41;
        color: #00ff41;
        font-family: monospace;
        cursor: pointer;
    }

    button:hover {
        background: #00ff41;
        color: #000;
    }

    @keyframes blink {
        50% {
            opacity: 0.35;
        }
    }
</style>
</head>

<body>

<div class="box">

    <h1 class="warning">⚠ VOCÊ FOI HACKEADO ⚠</h1>

    <p class="subtitle">
        SISTEMA COMPROMETIDO
    </p>

    <div id="timer">20:00</div>

    <div class="terminal">
        > Inicializando sistema...<br>
        > Verificando arquivos...<br>
        > Conexão estabelecida...<br>
        > <span class="fake">SIMULAÇÃO ATIVADA</span><br>
        > Nenhum arquivo está sendo alterado.
    </div>

    <button onclick="location.reload()">
        REINICIAR SIMULAÇÃO
    </button>

</div>

<script>
    let segundos = 20 * 60;

    function atualizarTimer() {
        let minutos = Math.floor(segundos / 60);
        let seg = segundos % 60;

        document.getElementById("timer").textContent =
            String(minutos).padStart(2, "0") + ":" +
            String(seg).padStart(2, "0");

        if (segundos > 0) {
            segundos--;
        } else {
            document.getElementById("timer").textContent = "00:00";
        }
    }

    atualizarTimer();
    setInterval(atualizarTimer, 1000);
</script>

</body>
</html>
