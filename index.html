<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SECURITY ALERT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* FUNDO VERDE */
#fundo {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
}

.codigo {
    position: absolute;
    top: -120%;

    color: #00ff00;
    font-size: 24px;
    font-weight: bold;
    line-height: 30px;

    text-shadow: 0 0 7px #00ff00;

    white-space: pre;

    /* VELOCIDADE NORMAL */
    animation: queda 14s linear infinite;
}

@keyframes queda {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(230vh);
    }
}

/* PAINEL */
.painel {
    position: absolute;
    z-index: 10;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;
    max-width: 850px;

    padding: 35px;

    background: rgba(0, 0, 0, 0.97);

    border: 2px solid #ff0000;

    box-shadow:
        0 0 25px #ff0000,
        0 0 70px rgba(255, 0, 0, 0.35);

    text-align: center;
}

/* TÍTULO */
h1 {
    margin: 0;

    color: #ff0000;

    font-size: clamp(35px, 7vw, 65px);

    text-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000;

    animation: glitch 0.8s infinite;
}

@keyframes glitch {
    0%, 100% {
        transform: translate(0);
    }

    25% {
        transform: translate(-3px, 1px);
    }

    50% {
        transform: translate(3px, -1px);
    }

    75% {
        transform: translate(-1px, 2px);
    }
}

.subtitulo {
    margin-top: 15px;

    color: #ff4444;

    font-size: 18px;

    letter-spacing: 3px;
}

/* TIMER */
#timer {
    display: inline-block;

    margin: 30px 0;
    padding: 8px 25px;

    color: #ff0000;
    background: #000;

    border: 2px solid #ff0000;

    font-size: clamp(70px, 15vw, 120px);

    font-weight: bold;

    text-shadow: 0 0 30px #ff0000;

    box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
}

/* TERMINAL */
.terminal {
    padding: 20px;

    text-align: left;

    background: #030000;

    border: 1px solid #550000;

    color: #ff5555;

    line-height: 1.8;
}

.vermelho {
    color: #ff0000;
    font-weight: bold;
}

.verde {
    color: #00ff00;
    font-weight: bold;
}

/* BARRA */
.barra {
    height: 10px;

    margin-top: 20px;

    background: #250000;
}

#progresso {
    width: 100%;
    height: 100%;

    background: #ff0000;

    box-shadow: 0 0 15px #ff0000;

    transition: width 1s linear;
}
</style>
</head>

<body>

<!-- CÓDIGOS DO FUNDO -->
<div id="fundo"></div>

<!-- PAINEL -->
<div class="painel">

    <h1>⚠ SYSTEM ALERT ⚠</h1>

    <div class="subtitulo">
        UNAUTHORIZED ACCESS DETECTED
    </div>

    <!-- 20 MINUTOS -->
    <div id="timer">20:00</div>

    <div class="terminal">

        &gt; SYSTEM STATUS:
        <span class="vermelho">CRITICAL</span><br>

        &gt; SECURITY LEVEL:
        <span class="vermelho">DANGER</span><br>

        &gt; UNKNOWN USER:
        <span class="verde">IDIOT</span><br>

        &gt; CONNECTION:
        <span class="verde">ACTIVE</span><br>

        &gt; COUNTDOWN:
        <span class="vermelho">RUNNING</span>

    </div>

    <div class="barra">
        <div id="progresso"></div>
    </div>

</div>

<script>

/* =========================
   CÓDIGOS DO FUNDO
   ========================= */

const fundo = document.getElementById("fundo");

const caracteres =
"010101 110010 001101 101010 010011 ERROR 404 SYSTEM";

for (let i = 0; i < 16; i++) {

    const codigo = document.createElement("div");

    codigo.className = "codigo";

    codigo.style.left =
        Math.random() * 100 + "%";

    /* VELOCIDADES LEVEMENTE DIFERENTES */
    codigo.style.animationDuration =
        (12 + Math.random() * 6) + "s";

    codigo.style.animationDelay =
        Math.random() * 10 + "s";

    let texto = "";

    for (let j = 0; j < 65; j++) {
        texto += caracteres + "\n";
    }

    codigo.textContent = texto;

    fundo.appendChild(codigo);
}


/* =========================
   TIMER 20 MINUTOS
   VELOCIDADE 2×
   ========================= */

const tempoTotal = 20 * 60;

let tempo = tempoTotal;

const timer =
    document.getElementById("timer");

const progresso =
    document.getElementById("progresso");


function atualizarTimer() {

    const minutos =
        Math.floor(tempo / 60);

    const segundos =
        tempo % 60;

    timer.textContent =
        String(minutos).padStart(2, "0") +
        ":" +
        String(segundos).padStart(2, "0");


    const porcentagem =
        (tempo / tempoTotal) * 100;

    progresso.style.width =
        porcentagem + "%";


    /* 2× */
    if (tempo > 0) {
        tempo -= 2;
    }
}


/* COMEÇA EM 20:00 */
atualizarTimer();

setInterval(atualizarTimer, 1000);

</script>

</body>
</html>
