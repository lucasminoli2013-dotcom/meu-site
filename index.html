<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🇷🇺 Системное предупреждение</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* NÚMEROS DO FUNDO — ROXO */
#matrix {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: .38;
}

.code {
    position: absolute;
    top: -120%;
    color: #b000ff;
    font-size: 17px;
    line-height: 25px;
    white-space: pre;
    text-shadow: 0 0 8px #b000ff;
    animation: fall linear infinite;
}

@keyframes fall {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(230vh);
    }
}

/* ESCURECIMENTO */
.dark {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(
        circle,
        transparent 10%,
        rgba(0,0,0,.92) 100%
    );
}

/* PAINEL */
.panel {
    position: absolute;
    z-index: 5;

    width: 92%;
    max-width: 720px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 22px 16px;

    background: rgba(4,0,0,.97);

    border: 2px solid red;

    box-shadow:
        0 0 25px red,
        0 0 70px rgba(255,0,0,.3);

    text-align: center;
}

/* ALERTA */
.warning {
    color: red;
    font-size: clamp(13px, 4vw, 19px);
    font-weight: bold;
    letter-spacing: 2px;
    animation: blink .8s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

/* TÍTULO */
h1 {
    margin: 12px 0;

    color: red;

    font-size: clamp(28px, 8vw, 55px);

    text-shadow:
        0 0 10px red,
        0 0 30px red;
}

/* TIMER — VERDE */
#timer {
    display: inline-block;

    color: #00ff33;

    background: #000;

    border: 2px solid #00ff33;

    padding: 3px 14px;

    font-size: clamp(65px, 18vw, 115px);

    font-weight: bold;

    text-shadow: 0 0 25px #00ff33;

    box-shadow:
        0 0 20px rgba(0,255,51,.6);
}

/* TERMINAL */
.terminal {
    margin-top: 17px;

    padding: 14px;

    background: #010101;

    border: 1px solid #550000;

    text-align: left;

    color: #ff4444;

    font-size: 13px;

    line-height: 1.9;
}

.green {
    color: #00ff33;
}

.red {
    color: red;
    font-weight: bold;
}

/* BARRA VERDE */
.bar {
    height: 8px;

    margin-top: 17px;

    background: #102500;
}

#progress {
    width: 100%;

    height: 100%;

    background: #00ff33;

    box-shadow: 0 0 12px #00ff33;

    transition: width 1s linear;
}

/* STATUS */
#status {
    margin-top: 12px;

    color: red;

    font-size: 13px;

    font-weight: bold;
}

/* X VÍDEOS */
.videos {
    margin-top: 16px;

    padding-top: 12px;

    border-top: 1px solid #550000;

    color: #b000ff;

    font-size: 17px;

    font-weight: bold;

    letter-spacing: 3px;

    text-shadow: 0 0 10px #b000ff;
}
</style>
</head>

<body>

<div id="matrix"></div>

<div class="dark"></div>

<div class="panel">

    <div class="warning">
        🇷🇺 ⚠ СИСТЕМА УСПЕШНО ВЗЛОМАНА ⚠ 🇷🇺
    </div>

    <h1>🇷🇺 ДОСТУП РАЗРЕШЁН 🇷🇺</h1>

    <div id="timer">05:00</div>

    <div class="terminal">

        &gt; ФОРМАТИРОВАНИЕ УСТРОЙСТВА:
        <span class="green">05:00</span><br>

        &gt; КОПИРОВАНИЕ ДАННЫХ:
        <span class="green">УСПЕШНО</span><br>

        &gt; ВЗЛОМ:
        <span class="green">УСПЕШНО</span><br>

        &gt; МЕСТОПОЛОЖЕНИЕ:
        <span class="green">УСПЕШНО</span><br>

        &gt; СОСТОЯНИЕ СИСТЕМЫ:
        <span class="red">КРИТИЧЕСКОЕ</span>

    </div>

    <div class="bar">
        <div id="progress"></div>
    </div>

    <div id="status">
        ПРОЦЕСС ИНИЦИАЛИЗИРУЕТСЯ...
    </div>

    <div class="videos">
        X ВИДЕО
    </div>

</div>

<script>

/* NÚMEROS ROXOS NO FUNDO */

const matrix = document.getElementById("matrix");

const chars =
"010101 110010 001101 101010 001100 ОШИБКА 404";

for (let i = 0; i < 15; i++) {

    const code = document.createElement("div");

    code.className = "code";

    code.style.left =
        Math.random() * 100 + "%";

    code.style.animationDuration =
        (13 + Math.random() * 6) + "s";

    code.style.animationDelay =
        Math.random() * 8 + "s";

    let text = "";

    for (let j = 0; j < 80; j++) {
        text += chars + "\n";
    }

    code.textContent = text;

    matrix.appendChild(code);
}


/* TIMER DE 5 MINUTOS */

let remaining = 5 * 60;

const timer = document.getElementById("timer");

const progress = document.getElementById("progress");

function updateTimer() {

    const minutes = Math.floor(remaining / 60);

    const seconds = remaining % 60;

    timer.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    progress.style.width =
        (remaining / (5 * 60) * 100) + "%";

    if (remaining > 0) {
        remaining--;
    }
}

updateTimer();

setInterval(updateTimer, 1000);


/* MENSAGENS */

const messages = [
    "ПРОЦЕСС ИНИЦИАЛИЗИРУЕТСЯ...",
    "ПРОТОКОЛ БЕЗОПАСНОСТИ АКТИВЕН...",
    "ОБРАБОТКА ДАННЫХ...",
    "СОЕДИНЕНИЕ АКТИВНО...",
    "ДОСТУП РАЗРЕШЁН...",
    "СОСТОЯНИЕ СИСТЕМЫ: КРИТИЧЕСКОЕ..."
];

let index = 0;

setInterval(() => {

    document.getElementById("status").textContent =
        messages[index];

    index = (index + 1) % messages.length;

}, 1800);

</script>

</body>
</html>
