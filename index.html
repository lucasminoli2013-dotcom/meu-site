<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURITY ALERT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #020000;
    color: #ff2020;
    font-family: "Courier New", monospace;
}

/* CÓDIGOS NO FUNDO */
#matrix {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    opacity: .25;
}

.column {
    position: absolute;
    top: -100%;
    color: #ff0000;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre;
    animation: fall linear infinite;
}

@keyframes fall {
    from {
        transform: translateY(-100%);
    }

    to {
        transform: translateY(220vh);
    }
}

/* EFEITO DE VERMELHO NA TELA */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    box-shadow: inset 0 0 120px rgba(255, 0, 0, .35);
}

/* PAINEL */
.container {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 850px;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    padding: 35px;
    text-align: center;

    background: rgba(5, 0, 0, .94);

    border: 2px solid #ff0000;

    box-shadow:
        0 0 20px #ff0000,
        0 0 60px rgba(255, 0, 0, .25);
}

h1 {
    margin: 0;
    font-size: clamp(35px, 7vw, 70px);
    color: #ff0000;
    text-shadow: 0 0 25px #ff0000;
    animation: glitch .8s infinite;
}

@keyframes glitch {
    0%, 100% {
        transform: translate(0);
    }

    25% {
        transform: translate(-2px, 1px);
    }

    50% {
        transform: translate(2px, -1px);
    }

    75% {
        transform: translate(-1px, 2px);
    }
}

.subtitle {
    margin-top: 15px;
    color: #ff5555;
    font-size: 17px;
    letter-spacing: 3px;
}

#timer {
    margin: 25px 0;
    font-size: clamp(65px, 14vw, 120px);
    font-weight: bold;
    color: #ff0000;
    text-shadow: 0 0 30px #ff0000;
}

.terminal {
    padding: 20px;
    text-align: left;
    background: #050000;
    border: 1px solid #660000;
    line-height: 1.8;
    color: #ff4444;
}

.red {
    color: #ff0000;
    font-weight: bold;
}

.progress {
    height: 8px;
    margin-top: 20px;
    background: #220000;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 100%;
    background: #ff0000;
    box-shadow: 0 0 15px #ff0000;
    transition: width 1s linear;
}
</style>
</head>

<body>

<div id="matrix"></div>

<div class="container">

    <h1>⚠ SYSTEM ALERT ⚠</h1>

    <div class="subtitle">
        SECURITY WARNING
    </div>

    <div id="timer">20:00</div>

    <div class="terminal">

        &gt; CONNECTION:
        <span class="red">ACTIVE</span><br>

        &gt; SECURITY LEVEL:
        <span class="red">CRITICAL</span><br>

        &gt; SYSTEM STATUS:
        <span class="red">WARNING</span><br>

        &gt; COUNTDOWN:
        <span class="red">RUNNING</span>

    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

</div>

<script>

/* CÓDIGOS DESCENDO NO FUNDO */

const matrix = document.getElementById("matrix");

const chars =
"0101010101010101 ERROR SYSTEM ACCESS 404 00110101 WARNING";

for (let i = 0; i < 25; i++) {

    const column = document.createElement("div");

    column.className = "column";

    column.style.left =
        Math.random() * 100 + "%";

    column.style.animationDuration =
        (5 + Math.random() * 10) + "s";

    column.style.animationDelay =
        Math.random() * 8 + "s";

    let text = "";

    for (let j = 0; j < 80; j++) {

        text += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );

        text += "\n";
    }

    column.textContent = text;

    matrix.appendChild(column);
}


/* CONTADOR DE 20 MINUTOS */

const total = 20 * 60;

let time = total;

function updateTimer() {

    const minutes = Math.floor(time / 60);

    const seconds = time % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    const percentage =
        (time / total) * 100;

    document.getElementById("bar").style.width =
        percentage + "%";

    if (time > 0) {
        time--;
    } else {
        document.getElementById("timer").textContent =
            "00:00";
    }
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
