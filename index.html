
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: "Courier New", monospace;
        }

        /* =========================
           FUNDO
        ========================= */

        #matrix {
            position: fixed;
            inset: 0;
            overflow: hidden;
            opacity: 0.28;
            z-index: 1;
        }

        .code {
            position: absolute;
            top: -120%;

            color: #a000ff;
            font-size: 14px;
            line-height: 25px;
            white-space: pre;

            text-shadow: 0 0 8px #a000ff;

            animation: fall linear infinite;
        }

        @keyframes fall {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(230vh);
            }
        }

        /* =========================
           ESCURECIMENTO
        ========================= */

        .dark {
            position: fixed;
            inset: 0;
            z-index: 2;

            background:
                radial-gradient(
                    circle,
                    transparent 5%,
                    rgba(0,0,0,.94) 90%
                );
        }

        /* =========================
           PAINEL
        ========================= */

        .panel {
            position: absolute;
            z-index: 5;

            width: 88%;
            max-width: 650px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 20px;

            text-align: center;

            background: rgba(3,0,0,.97);

            border: 2px solid red;

            box-shadow:
                0 0 25px red,
                0 0 70px rgba(255,0,0,.3);
        }

        /* =========================
           ALERTA
        ========================= */

        .warning {
            color: #ff2222;

            font-size: clamp(11px, 3vw, 18px);

            font-weight: bold;

            letter-spacing: 1px;

            animation: blink .8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: .25;
            }
        }

        /* =========================
           TÍTULO
        ========================= */

        h1 {
            margin: 12px 0 16px;

            color: red;

            font-size: clamp(23px, 7vw, 48px);

            text-shadow:
                0 0 10px red,
                0 0 25px red;
        }

        /* =========================
           TIMER
        ========================= */

        #timer {
            display: inline-block;

            padding: 4px 15px;

            background: #000;

            border: 2px solid #00ff33;

            color: #00ff33;

            font-size: clamp(55px, 17vw, 100px);

            font-weight: bold;

            letter-spacing: 2px;

            text-shadow:
                0 0 12px #00ff33,
                0 0 25px #00ff33;

            box-shadow:
                0 0 20px rgba(0,255,51,.55);
        }

        /* =========================
           TERMINAL
        ========================= */

        .terminal {
            margin-top: 16px;

            padding: 13px;

            background: #010101;

            border: 1px solid #4d0000;

            text-align: left;

            color: #ff5555;

            font-size: clamp(10px, 2.8vw, 14px);

            line-height: 1.8;
        }

        .green {
            color: #00ff33;
        }

        .red {
            color: #ff2222;
            font-weight: bold;
        }

        /* =========================
           BARRA
        ========================= */

        .bar {
            width: 100%;
            height: 7px;

            margin-top: 16px;

            background: #102000;
        }

        #progress {
            width: 100%;
            height: 100%;

            background: #00ff33;

            box-shadow: 0 0 12px #00ff33;

            transition: width 1s linear;
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            margin-top: 12px;

            color: #ff3333;

            font-size: clamp(9px, 2.7vw, 13px);

            font-weight: bold;
        }

        /* =========================
           VÍDEOS
        ========================= */

        .videos {
            margin-top: 13px;

            padding-top: 10px;

            border-top: 1px solid #440000;

            color: #b000ff;

            font-size: clamp(12px, 3.5vw, 17px);

            font-weight: bold;

            letter-spacing: 2px;

            text-shadow: 0 0 10px #b000ff;
        }

        /* =========================
           BOTÃO
        ========================= */

        #fullscreenBtn {
            margin-top: 13px;

            padding: 8px 15px;

            background: #050505;

            border: 1px solid #555;

            color: #aaa;

            font-family: "Courier New", monospace;

            font-size: 11px;

            cursor: pointer;
        }

        /* =========================
           GLITCH NO FINAL
        ========================= */

        .glitch {
            animation: shake .12s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(-50%, -50%);
            }

            25% {
                transform: translate(
                    calc(-50% + 3px),
                    calc(-50% - 2px)
                );
            }

            50% {
                transform: translate(
                    calc(-50% - 3px),
                    calc(-50% + 2px)
                );
            }

            75% {
                transform: translate(
                    calc(-50% + 2px),
                    calc(-50% + 3px)
                );
            }

            100% {
                transform: translate(-50%, -50%);
            }
        }

        /* =========================
           TELA CONCLUÍDO
        ========================= */

        #completed {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: none;

            justify-content: center;
            align-items: center;

            background: #000;

            color: #00ff33;

            font-family: "Courier New", monospace;

            font-size: clamp(
                55px,
                15vw,
                190px
            );

            font-weight: bold;

            text-align: center;

            text-shadow:
                0 0 15px #00ff33,
                0 0 35px #00ff33,
                0 0 70px #00ff33;

            animation: completedGlow 1s infinite alternate;
        }

        @keyframes completedGlow {
            from {
                opacity: .75;
            }

            to {
                opacity: 1;
            }
        }

        /* =========================
           TELAS PEQUENAS
        ========================= */

        @media (max-height: 650px) {

            .panel {
                padding: 10px;
            }

            h1 {
                margin: 5px 0 8px;
            }

            .terminal {
                margin-top: 8px;
                line-height: 1.5;
            }

            .videos {
                margin-top: 7px;
            }
        }
    </style>
</head>

<body>

    <!-- FUNDO ROXO -->
    <div id="matrix"></div>

    <!-- ESCURECIMENTO -->
    <div class="dark"></div>

    <!-- PAINEL PRINCIPAL -->
    <div class="panel" id="panel">

        <div class="warning">
            🇷🇺 ⚠ СИСТЕМНОЕ ПРЕДУПРЕЖДЕНИЕ ⚠ 🇷🇺
        </div>

        <h1>
            🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺
        </h1>

        <div id="timer">
            05:00
        </div>

        <div class="terminal">

            &gt; ФОРМАТИРОВАНИЕ:
            <span class="green">АКТИВНО</span><br>

            &gt; КОПИРОВАНИЕ ДАННЫХ:
            <span class="green">УСПЕШНО</span><br>

            &gt; ОБРАБОТКА СИСТЕМЫ:
            <span class="green">ЗАВЕРШЕНО</span><br>

            &gt; СОЕДИНЕНИЕ:
            <span class="green">АКТИВНО</span><br>

            &gt; СОСТОЯНИЕ:
            <span class="red">КРИТИЧЕСКОЕ</span>

        </div>

        <div class="bar">
            <div id="progress"></div>
        </div>

        <div id="status">
            СОЕДИНЕНИЕ АКТИВНО...
        </div>

        <div class="videos">
            X ВИДЕОЗАПИСЕЙ
        </div>

        <button id="fullscreenBtn">
            ПОЛНЫЙ ЭКРАН
        </button>

    </div>

    <!-- TELA FINAL -->
    <div id="completed">
        ЗАВЕРШЕНО
    </div>


    <script>

        /* =========================
           CÓDIGOS ROXOS
        ========================= */

        const matrix =
            document.getElementById("matrix");

        const chars =
            "010101 110010 001101 101010 001100 404 ERROR";

        for (let i = 0; i < 12; i++) {

            const code =
                document.createElement("div");

            code.className = "code";

            code.style.left =
                Math.random() * 100 + "%";

            code.style.animationDuration =
                (32 + Math.random() * 18) + "s";

            code.style.animationDelay =
                Math.random() * 15 + "s";

            let text = "";

            for (let j = 0; j < 75; j++) {
                text += chars + "\n";
            }

            code.textContent = text;

            matrix.appendChild(code);
        }


        /* =========================
           TIMER
        ========================= */

        let remaining = 5 * 60;

        const timer =
            document.getElementById("timer");

        const progress =
            document.getElementById("progress");

        const panel =
            document.getElementById("panel");

        const completed =
            document.getElementById("completed");


        function updateTimer() {

            const minutes =
                Math.floor(remaining / 60);

            const seconds =
                remaining % 60;

            timer.textContent =
                String(minutes).padStart(2, "0")
                + ":" +
                String(seconds).padStart(2, "0");


            progress.style.width =
                (remaining / 300 * 100) + "%";


            /* ÚLTIMO MINUTO */

            if (
                remaining <= 60 &&
                remaining > 0
            ) {

                panel.classList.add("glitch");

            }


            /* CHEGOU A ZERO */

            if (remaining <= 0) {

                clearInterval(timerInterval);

                panel.style.display = "none";

                matrix.style.display = "none";

                document.querySelector(".dark")
                    .style.display = "none";

                completed.style.display = "flex";

                return;
            }

            remaining--;
        }


        updateTimer();


        const timerInterval =
            setInterval(updateTimer, 1000);


        /* =========================
           MENSAGENS
        ========================= */

        const messages = [

            "СОЕДИНЕНИЕ АКТИВНО...",

            "ПРОВЕРКА СИСТЕМЫ...",

            "ОБРАБОТКА ДАННЫХ...",

            "ПРОТОКОЛ БЕЗОПАСНОСТИ АКТИВЕН...",

            "ДОСТУП РАЗРЕШЁН...",

            "СОСТОЯНИЕ: КРИТИЧЕСКОЕ..."

        ];

        let index = 0;

        setInterval(() => {

            document.getElementById("status")
                .textContent = messages[index];

            index++;

            if (index >= messages.length) {
                index = 0;
            }

        }, 2200);


        /* =========================
           TELA CHEIA
        ========================= */

        document
            .getElementById("fullscreenBtn")
            .addEventListener("click", () => {

                const page =
                    document.documentElement;

                if (page.requestFullscreen) {

                    page.requestFullscreen()
                        .catch(() => {});

                }

                document
                    .getElementById("fullscreenBtn")
                    .style.display = "none";

            });

    </script>

</body>
</html>
