<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* FUNDO ROXO */
#matrix {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: .28;
}

.code {
    position: absolute;
    top: -120%;
    color: #a000ff;
    font-size: 14px;
    line-height: 25px;
    white-space: pre;
    text-shadow: 0 0 8px #a000ff;

    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes fall {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(230vh);
    }
}

/* ESCURECIMENTO */
.dark {
    position: fixed;
    inset: 0;
    z-index: 2;

    background:
        radial-gradient(
            circle,
            transparent 5%,
            rgba(0,0,0,.92) 90%
        );
}

/* PAINEL */
.panel {
    position: absolute;
    z-index: 5;

    width: 88%;
    max-width: 600px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 18px 14px;

    background: rgba(3,0,0,.97);

    border: 2px solid red;

    box-shadow:
        0 0 25px red,
        0 0 70px rgba(255,0,0,.25);

    text-align: center;
}

/* ALERTA */
.warning {
    color: #ff2222;

    font-size: clamp(11px, 3.2vw, 18px);

    font-weight: bold;

    letter-spacing: 1px;

    animation: blink .9s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

/* TÍTULO */
h1 {
    margin: 10px 0 14px;

    color: red;

    font-size: clamp(22px, 7vw, 45px);

    text-shadow:
        0 0 10px red,
        0 0 25px red;
}

/* TIMER VERDE */
#timer {
    display: inline-block;

    padding: 2px 13px;

    background: #000;

    border: 2px solid #00ff33;

    color: #00ff33;

    font-size: clamp(55px, 17vw, 95px);

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 0 12px #00ff33,
        0 0 25px #00ff33;

    box-shadow:
        0 0 20px rgba(0,255,51,.55);
}

/* TERMINAL */
.terminal {
    margin-top: 15px;

    padding: 12px;

    background: #010101;

    border: 1px solid #4d0000;

    text-align: left;

    color: #ff5555;

    font-size: clamp(10px, 2.8vw, 14px);

    line-height: 1.85;
}

.green {
    color: #00ff33;
}

.red {
    color: #ff2222;
    font-weight: bold;
}

/* BARRA */
.bar {
    width: 100%;
    height: 7px;

    margin-top: 15px;

    background: #102000;
}

#progress {
    width: 100%;
    height: 100%;

    background: #00ff33;

    box-shadow: 0 0 12px #00ff33;

    transition: width 1s linear;
}

/* STATUS */
#status {
    margin-top: 11px;

    color: #ff3333;

    font-size: clamp(9px, 2.7vw, 13px);

    font-weight: bold;
}

/* VÍDEOS */
.videos {
    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid #440000;

    color: #b000ff;

    font-size: clamp(12px, 3.5vw, 17px);

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow: 0 0 10px #b000ff;
}

/* BOTÃO DE TELA CHEIA */
#fullscreenBtn {
    margin-top: 12px;

    padding: 8px 14px;

    background: #050505;

    border: 1px solid #555;

    color: #aaa;

    font-family: "Courier New", monospace;

    font-size: 11px;
}

/* TELAS BAIXAS */
@media (max-height: 650px) {

    .panel {
        padding: 10px;
    }

    h1 {
        margin: 5px 0 8px;
    }

    .terminal {
        margin-top: 8px;
        line-height: 1.5;
    }

    .videos {
        margin-top: 7px;
    }
}
</style>
</head>

<body>

<div id="matrix"></div>

<div class="dark"></div>

<div class="panel">

    <div class="warning">
        🇷🇺 ⚠ СИСТЕМА УСПЕШНО ВЗЛОМАНА ⚠ 🇷🇺
    </div>

    <h1>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</h1>

    <div id="timer">05:00</div>

    <div class="terminal">

        &gt; ФОРМАТИРОВАНИЕ:
        <span class="green">АКТИВНО</span><br>

        &gt; КОПИРОВАНИЕ ДАННЫХ:
        <span class="green">УСПЕШНО</span><br>

        &gt; ВЗЛОМ СИСТЕМЫ:
        <span class="green">УСПЕШНО</span><br>

        &gt; МЕСТОПОЛОЖЕНИЕ:
        <span class="green">ОПРЕДЕЛЕНО</span><br>

        &gt; СОСТОЯНИЕ:
        <span class="red">КРИТИЧЕСКОЕ</span>

    </div>

    <div class="bar">
        <div id="progress"></div>
    </div>

    <div id="status">
        СОЕДИНЕНИЕ АКТИВНО...
    </div>

    <div class="videos">
        X ВИДЕОЗАПИСЕЙ
    </div>

    <button id="fullscreenBtn">
        ПОЛНЫЙ ЭКРАН
    </button>

</div>

<script>

/* =========================
   NÚMEROS ROXOS DO FUNDO
========================= */

const matrix =
    document.getElementById("matrix");

const chars =
    "010101 110010 001101 101010 001100 404 ERROR";

for (let i = 0; i < 12; i++) {

    const code =
        document.createElement("div");

    code.className = "code";

    code.style.left =
        Math.random() * 100 + "%";

    /* NÚMEROS BEM LENTOS */

    code.style.animationDuration =
        (32 + Math.random() * 18) + "s";

    code.style.animationDelay =
        Math.random() * 15 + "s";

    let text = "";

    for (let j = 0; j < 75; j++) {
        text += chars + "\n";
    }

    code.textContent = text;

    matrix.appendChild(code);
}


/* =========================
   TIMER — 5 MINUTOS
========================= */

let remaining = 5 * 60;

const timer =
    document.getElementById("timer");

const progress =
    document.getElementById("progress");

function updateTimer() {

    const minutes =
        Math.floor(remaining / 60);

    const seconds =
        remaining % 60;

    timer.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    progress.style.width =
        (remaining / 300 * 100) + "%";

    if (remaining > 0) {
        remaining--;
    }
}

updateTimer();

setInterval(updateTimer, 1000);


/* =========================
   MENSAGENS
========================= */

const messages = [

    "СОЕДИНЕНИЕ АКТИВНО...",

    "ПРОВЕРКА СИСТЕМЫ...",

    "ОБРАБОТКА ДАННЫХ...",

    "ПРОТОКОЛ БЕЗОПАСНОСТИ АКТИВЕН...",

    "ДОСТУП РАЗРЕШЁН...",

    "СОСТОЯНИЕ: КРИТИЧЕСКОЕ..."

];

let index = 0;

setInterval(() => {

    document.getElementById("status")
        .textContent = messages[index];

    index++;

    if (index >= messages.length) {
        index = 0;
    }

}, 2200);


/* =========================
   TELA CHEIA
========================= */

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

fullscreenBtn.addEventListener("click", () => {

    const page = document.documentElement;

    if (page.requestFullscreen) {

        page.requestFullscreen().catch(() => {});

    } else if (page.webkitRequestFullscreen) {

        page.webkitRequestFullscreen();

    }

    fullscreenBtn.style.display = "none";
});

</script>

</body>
</html>
