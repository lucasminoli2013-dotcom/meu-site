<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SECURITY ALERT</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: #050000;
        color: #ff2222;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    /* CÓDIGOS DO FUNDO */
    #background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        opacity: 0.25;
    }

    .code {
        position: absolute;
        top: -100%;
        color: #ff0000;
        font-size: 14px;
        line-height: 20px;
        white-space: pre;
        animation: queda linear infinite;
    }

    @keyframes queda {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(220vh);
        }
    }

    /* PAINEL CENTRAL */
    .box {
        position: absolute;
        z-index: 5;

        width: 90%;
        max-width: 800px;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        padding: 35px;

        background: rgba(5, 0, 0, 0.95);

        border: 2px solid #ff0000;

        box-shadow:
            0 0 20px #ff0000,
            0 0 50px rgba(255, 0, 0, 0.4);

        text-align: center;
    }

    h1 {
        margin: 0;

        font-size: clamp(32px, 7vw, 65px);

        color: #ff0000;

        text-shadow: 0 0 20px #ff0000;

        animation: piscar 1s infinite;
    }

    @keyframes piscar {
        50% {
            opacity: 0.6;
        }
    }

    .subtitle {
        margin-top: 15px;

        font-size: 17px;

        letter-spacing: 3px;

        color: #ff5555;
    }

    /* TIMER */
    #timer {
        margin: 30px 0;

        font-size: clamp(65px, 14vw, 110px);

        font-weight: bold;

        color: #ff0000;

        text-shadow: 0 0 25px #ff0000;
    }

    /* TERMINAL */
    .terminal {
        padding: 20px;

        text-align: left;

        background: #020000;

        border: 1px solid #660000;

        line-height: 1.8;

        color: #ff5555;
    }

    .red {
        color: #ff0000;
        font-weight: bold;
    }

    /* BARRA */
    .progress {
        width: 100%;
        height: 8px;

        margin-top: 20px;

        background: #250000;
    }

    #bar {
        width: 100%;
        height: 100%;

        background: #ff0000;

        box-shadow: 0 0 15px #ff0000;

        transition: width 1s linear;
    }
</style>
</head>

<body>

<!-- FUNDO -->
<div id="background"></div>

<!-- PAINEL -->
<div class="box">

    <h1>⚠ SYSTEM ALERT ⚠</h1>

    <div class="subtitle">
        SECURITY WARNING
    </div>

    <div id="timer">
        20:00
    </div>

    <div class="terminal">

        &gt; SYSTEM STATUS:
        <span class="red">WARNING</span><br>

        &gt; SECURITY LEVEL:
        <span class="red">CRITICAL</span><br>

        &gt; CONNECTION:
        <span class="red">ACTIVE</span><br>

        &gt; COUNTDOWN:
        <span class="red">RUNNING</span>

    </div>

    <div class="progress">
        <div id="bar"></div>
    </div>

</div>

<script>

    /* CRIAR CÓDIGOS NO FUNDO */

    const background = document.getElementById("background");

    const characters =
        "01010101 11001010 ERROR 404 SYSTEM WARNING ACCESS 00110101";

    for (let i = 0; i < 20; i++) {

        const code = document.createElement("div");

        code.className = "code";

        code.style.left =
            Math.random() * 100 + "%";

        code.style.animationDuration =
            (6 + Math.random() * 8) + "s";

        code.style.animationDelay =
            Math.random() * 8 + "s";

        let text = "";

        for (let j = 0; j < 60; j++) {

            text += characters + "\n";

        }

        code.textContent = text;

        background.appendChild(code);
    }


    /* TIMER */

    const totalTime = 20 * 60;

    let timeLeft = totalTime;

    const timer = document.getElementById("timer");

    const bar = document.getElementById("bar");


    function updateTimer() {

        const minutes =
            Math.floor(timeLeft / 60);

        const seconds =
            timeLeft % 60;

        timer.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");


        const percentage =
            (timeLeft / totalTime) * 100;

        bar.style.width =
            percentage + "%";


        if (timeLeft > 0) {

            timeLeft--;

        }

    }


    updateTimer();

    setInterval(updateTimer, 1000);

</script>

</body>
</html>
