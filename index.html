
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* FUNDO COM CÓDIGOS ROXOS */
#matrix {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: 0.3;
}

.code {
    position: absolute;
    top: -120%;
    color: #a000ff;
    font-size: 14px;
    line-height: 24px;
    white-space: pre;
    text-shadow: 0 0 8px #a000ff;
    animation: fall linear infinite;
}

@keyframes fall {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(230vh);
    }
}

/* ESCURECIMENTO */
.dark {
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle,
        transparent,
        rgba(0,0,0,.92)
    );
}

/* PAINEL */
.panel {
    position: absolute;
    z-index: 2;

    width: 88%;
    max-width: 600px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 18px;

    text-align: center;

    background: rgba(5,0,0,.96);

    border: 2px solid red;

    box-shadow:
        0 0 25px red,
        0 0 70px rgba(255,0,0,.3);
}

/* ALERTA */
.warning {
    color: red;
    font-weight: bold;
    font-size: clamp(11px, 3vw, 18px);
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

/* TÍTULO */
h1 {
    color: red;
    font-size: clamp(24px, 7vw, 45px);

    text-shadow:
        0 0 10px red,
        0 0 25px red;
}

/* TIMER */
#timer {
    display: inline-block;

    color: #00ff33;
    background: black;

    border: 2px solid #00ff33;

    padding: 5px 15px;

    font-size: clamp(55px, 17vw, 100px);
    font-weight: bold;

    text-shadow: 0 0 20px #00ff33;
    box-shadow: 0 0 20px #00ff33;
}

/* TERMINAL */
.terminal {
    margin-top: 15px;
    padding: 12px;

    text-align: left;

    color: #ff5555;
    background: black;

    border: 1px solid #550000;

    font-size: clamp(10px, 3vw, 14px);
    line-height: 1.8;
}

.green {
    color: #00ff33;
}

.red {
    color: red;
    font-weight: bold;
}

/* BARRA */
.bar {
    height: 7px;
    margin-top: 15px;
    background: #102000;
}

#progress {
    width: 100%;
    height: 100%;

    background: #00ff33;

    box-shadow: 0 0 12px #00ff33;
}

/* STATUS */
#status {
    margin-top: 12px;

    color: red;

    font-size: 12px;
    font-weight: bold;
}

/* TELA FINAL */
#completed {
    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: black;

    color: #00ff33;

    font-family: "Courier New", monospace;

    font-size: clamp(55px, 18vw, 200px);
    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 20px #00ff33,
        0 0 60px #00ff33;

    z-index: 999;
}
</style>
</head>

<body>

<div id="matrix"></div>

<div class="dark"></div>

<div class="panel" id="panel">

    <div class="warning">
        🇷🇺 ⚠ СИСТЕМА УСПЕШНО ВЗЛОМАНА ⚠ 🇷🇺
    </div>

    <h1>🇷🇺 ТЁМНАЯ ТРЕВОГА 🇷🇺</h1>

    <div id="timer">05:00</div>

    <div class="terminal">

        &gt; ФОРМАТИРОВАНИЕ:
        <span class="green">АКТИВНО</span><br>

        &gt; КОПИРОВАНИЕ ДАННЫХ:
        <span class="green">УСПЕШНО</span><br>

        &gt; ВЗЛОМ СИСТЕМЫ:
        <span class="green">УСПЕШНО</span><br>

        &gt; СОСТОЯНИЕ:
        <span class="red">КРИТИЧЕСКОЕ</span>

    </div>

    <div class="bar">
        <div id="progress"></div>
    </div>

    <div id="status">
        СОЕДИНЕНИЕ АКТИВНО...
    </div>

</div>

<div id="completed">
    ЗАВЕРШЕНО
</div>

<script>

/* CÓDIGOS ROXOS */

const matrix = document.getElementById("matrix");

const chars = "010101 110010 001101 101010 ОШИБКА 404";

for (let i = 0; i < 12; i++) {

    const code = document.createElement("div");

    code.className = "code";

    code.style.left =
        Math.random() * 100 + "%";

    code.style.animationDuration =
        (30 + Math.random() * 15) + "s";

    code.style.animationDelay =
        Math.random() * 10 + "s";

    let text = "";

    for (let j = 0; j < 70; j++) {
        text += chars + "\n";
    }

    code.textContent = text;

    matrix.appendChild(code);
}


/* TIMER DE 5 MINUTOS */

let remaining = 5 * 60;

const timer = document.getElementById("timer");
const progress = document.getElementById("progress");

const timerInterval = setInterval(() => {

    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    timer.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    progress.style.width =
        (remaining / 300 * 100) + "%";

    if (remaining <= 0) {

        clearInterval(timerInterval);

        document.getElementById("panel").style.display = "none";

        document.getElementById("matrix").style.display = "none";

        document.getElementById("completed").style.display = "flex";

        return;
    }

    remaining--;

}, 1000);


/* MENSAGENS */

const messages = [
    "СОЕДИНЕНИЕ АКТИВНО...",
    "ОБРАБОТКА ДАННЫХ...",
    "ПРОВЕРКА СИСТЕМЫ...",
    "ДОСТУП РАЗРЕШЁН..."
];

let index = 0;

setInterval(() => {

    document.getElementById("status").textContent =
        messages[index];

    index = (index + 1) % messages.length;

}, 2200);

</script>

</body>
</html>
