<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURITY ALERT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* FUNDO */
#codigo {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
}

.coluna {
    position: absolute;
    top: -100%;
    color: #00ff22;
    font-size: 25px;
    line-height: 30px;
    font-weight: bold;
    text-shadow: 0 0 8px #00ff22;
    white-space: pre;
    animation: cair linear infinite;
}

@keyframes cair {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(220vh);
    }
}

/* PAINEL */
.painel {
    position: absolute;
    z-index: 10;

    width: 90%;
    max-width: 850px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 35px;

    background: rgba(0, 0, 0, 0.97);

    border: 2px solid red;

    box-shadow:
        0 0 25px red,
        0 0 80px rgba(255, 0, 0, 0.35);

    text-align: center;
}

/* TÍTULO */
h1 {
    margin: 0;

    color: red;

    font-size: clamp(35px, 7vw, 70px);

    text-shadow:
        0 0 10px red,
        0 0 30px red;

    animation: glitch 0.7s infinite;
}

@keyframes glitch {

    0%, 100% {
        transform: translate(0);
    }

    25% {
        transform: translate(-3px, 2px);
    }

    50% {
        transform: translate(3px, -2px);
    }

    75% {
        transform: translate(-2px, 1px);
    }
}

.subtitulo {
    margin-top: 15px;

    color: #ff5555;

    font-size: 17px;

    letter-spacing: 3px;
}

/* TIMER */
#timer {
    display: inline-block;

    margin: 30px 0;

    padding: 8px 25px;

    color: red;

    background: #000;

    border: 2px solid red;

    font-size: clamp(70px, 15vw, 120px);

    font-weight: bold;

    text-shadow: 0 0 25px red;

    box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
}

/* TERMINAL */
.terminal {
    padding: 20px;

    text-align: left;

    color: #ff5555;

    background: #030000;

    border: 1px solid #550000;

    line-height: 1.8;
}

.vermelho {
    color: red;
    font-weight: bold;
}

.verde {
    color: #00ff22;
    font-weight: bold;
}

/* BARRA */
.barra {
    height: 10px;

    margin-top: 20px;

    background: #250000;

    border: 1px solid #550000;
}

#progresso {
    width: 100%;
    height: 100%;

    background: red;

    box-shadow: 0 0 15px red;

    transition: width 1s linear;
}
</style>
</head>

<body>

<div id="codigo"></div>

<div class="painel">

    <h1>⚠ SYSTEM ALERT ⚠</h1>

    <div class="subtitulo">
        UNAUTHORIZED ACCESS DETECTED
    </div>

    <div id="timer">
        20:00
    </div>

    <div class="terminal">

        &gt; SYSTEM STATUS:
        <span class="vermelho">CRITICAL</span><br>

        &gt; SECURITY LEVEL:
        <span class="vermelho">DANGER</span><br>

        &gt; UNKNOWN USER:
        <span class="verde">IDIOT</span><br>

        &gt; CONNECTION:
        <span class="verde">ACTIVE</span><br>

        &gt; COUNTDOWN:
        <span class="vermelho">RUNNING</span>

    </div>

    <div class="barra">
        <div id="progresso"></div>
    </div>

</div>

<script>

/* CÓDIGOS VERDES 2× */

const fundo = document.getElementById("codigo");

const caracteres =
"010101 110010 001101 ERROR 404 010101 SYSTEM 101010";

for (let i = 0; i < 18; i++) {

    const coluna = document.createElement("div");

    coluna.className = "coluna";

    coluna.style.left =
        Math.random() * 100 + "%";

    /* 2× MAIS RÁPIDO */
    coluna.style.animationDuration =
        (2.5 + Math.random() * 4) + "s";

    coluna.style.animationDelay =
        Math.random() * 5 + "s";

    let texto = "";

    for (let j = 0; j < 70; j++) {
        texto += caracteres + "\n";
    }

    coluna.textContent = texto;

    fundo.appendChild(coluna);
}


/* TIMER */

const tempoTotal = 20 * 60;

let tempo = tempoTotal;

const timer = document.getElementById("timer");

const progresso =
    document.getElementById("progresso");


function atualizar() {

    const minutos =
        Math.floor(tempo / 60);

    const segundos =
        tempo % 60;

    timer.textContent =
        String(minutos).padStart(2, "0") +
        ":" +
        String(segundos).padStart(2, "0");


    const porcentagem =
        (tempo / tempoTotal) * 100;

    progresso.style.width =
        porcentagem + "%";


    /* 2× DE VELOCIDADE */

    if (tempo > 0) {
        tempo -= 2;
    }

}


/* COMEÇA EM 20:00 */

atualizar();

setInterval(atualizar, 1000);

</script>

</body>
</html>
